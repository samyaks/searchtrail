openapi: 3.1.0
info:
  title: SearchTrail API
  version: 1.0.0-phase0
  summary: Evidence of how you searched.
  description: |
    The SearchTrail V1 API. This file is the **source of truth** for the frontend and the
    backend (see `docs/adr/0006-contract-first-openapi.md`). Changes go through a small PR
    approved by the integrator, with regenerated types in the same PR.

    Conventions:
    - Every path is under `/api/v1`.
    - The browser authenticates with an HTTP-only session cookie (`st_session`). No tokens reach
      the browser.
    - Field names are `snake_case`. Timestamps are RFC 3339 in UTC. Dates are `YYYY-MM-DD`.
    - Long actions (estimate, preview, term report, export, download, review set) return
      `202 Accepted` with a `Job`. Poll `GET /jobs/{jobId}` every 3 to 10 seconds.
    - Errors always use the `Error` body. The `code` values the UI must handle are listed on
      `ErrorCode`.
    - Examples use the sample data from `docs/design/` (matter M-2026-0142, Project Falcon).
  contact:
    name: SearchTrail maintainers
    url: https://github.com/samyaks/searchtrail
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: Same origin as the web app
security:
  - sessionCookie: []
tags:
  - name: system
    description: Health and setup
  - name: auth
    description: Entra ID sign-in (backend-for-frontend)
  - name: directory
    description: People and sensitivity labels from Microsoft 365
  - name: matters
    description: Matters, custodians, sites and holds (Define)
  - name: criteria
    description: Draft criteria, KQL and estimates (Scope)
  - name: previews
    description: Item-level previews (Preview)
  - name: terms
    description: Hits per search term (Terms)
  - name: exports
    description: Guarded exports and hand-off (Export)
  - name: log
    description: Query versions and the hash-chained log (Log)
  - name: jobs
    description: Status of long-running actions

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness and readiness
      description: Returns `ok` when the API is up and can reach the database. No sign-in needed.
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              examples:
                healthy:
                  value: { status: ok, version: 0.2.0, database: ok, dry_run: true }
        "503":
          description: The API is up but a dependency is not
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              examples:
                dbDown:
                  value: { status: degraded, version: 0.2.0, database: unreachable, dry_run: true }

  /auth/login:
    get:
      tags: [auth]
      operationId: login
      summary: Start Entra sign-in
      description: Redirects the browser to Microsoft Entra ID (authorization code flow with PKCE).
      security: []
      parameters:
        - name: return_to
          in: query
          description: App path to return to after sign-in. Must be a relative path.
          schema: { type: string, default: /matters, examples: [/matters/mat_falcon/scope] }
      responses:
        "302":
          description: Redirect to the Microsoft sign-in page
          headers:
            Location:
              description: The Entra authorize URL
              schema: { type: string }

  /auth/callback:
    get:
      tags: [auth]
      operationId: authCallback
      summary: Finish Entra sign-in
      description: Entra redirects here. The API redeems the code, stores tokens server-side (encrypted), sets the session cookie and redirects into the app.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          description: Authorization code from Entra
          schema: { type: string }
        - name: state
          in: query
          required: true
          description: Opaque state that ties the callback to the login request
          schema: { type: string }
      responses:
        "302":
          description: Signed in; redirect into the app
          headers:
            Location:
              description: The `return_to` path from the login request
              schema: { type: string }
            Set-Cookie:
              description: "`st_session`, HTTP-only, Secure, SameSite=Lax"
              schema: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out
      description: Ends the session and deletes the cached tokens for it.
      responses:
        "204":
          description: Signed out; the session cookie is cleared
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me:
    get:
      tags: [system]
      operationId: getMe
      summary: The signed-in user
      description: The signed-in user, their tenant and the Purview roles found for them.
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
              examples:
                dana:
                  value:
                    user: { id: usr_dana, display_name: Dana Whitfield, email: dana.whitfield@contoso.com, initials: DW }
                    tenant: { id: 6f1d2c3b-0000-4000-8000-000000000001, name: Contoso Ltd }
                    purview_roles: [eDiscovery Manager]
                    cloud: commercial
                    dry_run: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /setup/check:
    get:
      tags: [system]
      operationId: getSetupCheck
      summary: Check the connection to Purview
      description: Can SearchTrail reach Purview, which licenses and roles the user has, and which cloud it is using. Shown in the shell and on first run.
      responses:
        "200":
          description: The result of each check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupCheck" }
              examples:
                allGood:
                  value:
                    cloud: commercial
                    dry_run: false
                    ready: true
                    checks:
                      - { key: graph_reachable, label: Microsoft 365 connected, status: ok, message: Signed in to Contoso Ltd. }
                      - { key: ediscovery_license, label: Purview eDiscovery Premium, status: ok, message: E5 licence found. }
                      - { key: purview_role, label: eDiscovery Manager role, status: ok, message: Dana Whitfield is an eDiscovery Manager. }
                      - { key: download_permission, label: Export downloads, status: warning, message: "MicrosoftPurviewEDiscovery consent not found. Downloads will fail until an admin grants eDiscovery.Download.Read." }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /labels:
    get:
      tags: [directory]
      operationId: listLabels
      summary: Sensitivity labels
      description: Sensitivity labels with their sublabels. Choosing a parent label in a filter also matches its sublabels.
      responses:
        "200":
          description: Labels, parents first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabelList" }
              examples:
                contoso:
                  value:
                    items:
                      - { id: 11111111-1111-4111-8111-111111111111, name: Public, path: Public, description: Approved for anyone, sublabels: [] }
                      - { id: 22222222-2222-4222-8222-222222222222, name: General, path: General, description: Internal business data, sublabels: [] }
                      - id: 33333333-3333-4333-8333-333333333333
                        name: Confidential
                        path: Confidential
                        description: Includes the Finance and Legal sublabels
                        sublabels:
                          - { id: 44444444-4444-4444-8444-444444444444, name: Finance, path: Confidential/Finance, description: null, sublabels: [] }
                          - { id: 55555555-5555-4555-8555-555555555555, name: Legal, path: Confidential/Legal, description: null, sublabels: [] }
                      - { id: 66666666-6666-4666-8666-666666666666, name: Highly Confidential, path: Highly Confidential, description: "Often encrypted; reviewers may not open these", sublabels: [] }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /directory/users:
    get:
      tags: [directory]
      operationId: searchDirectoryUsers
      summary: Find people to add as custodians
      description: Searches the tenant directory by name, email or department.
      parameters:
        - name: q
          in: query
          required: true
          description: At least two characters
          schema: { type: string, minLength: 2, examples: [fin] }
      responses:
        "200":
          description: Matching people (at most 25)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryUserList" }
              examples:
                finance:
                  value:
                    items:
                      - { id: 3c1a7f5e-0000-4000-8000-0000000000b2, display_name: Megan Bowen, email: megan.bowen@contoso.com, department: Finance, initials: MB }
                      - { id: 3c1a7f5e-0000-4000-8000-0000000000c3, display_name: Hannah Ortega, email: hannah.ortega@contoso.com, department: Finance, initials: HO }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/Throttled"

  /matters:
    get:
      tags: [matters]
      operationId: listMatters
      summary: List matters
      description: Matters with their stage and latest counts, most recent activity first.
      parameters:
        - name: stage
          in: query
          description: Only matters in this stage
          schema: { $ref: "#/components/schemas/MatterStage" }
        - name: q
          in: query
          description: Text to match against the matter number and name
          schema: { type: string }
      responses:
        "200":
          description: Matters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatterList" }
              examples:
                designSample:
                  $ref: "#/components/examples/MatterListSample"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [matters]
      operationId: createMatter
      summary: Create a matter
      description: Creates the matter in SearchTrail and logs it. The Purview case is created the first time the matter is estimated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatterCreate" }
            examples:
              falcon:
                value:
                  matter_number: M-2026-0142
                  name: Project Falcon investigation
                  type: investigation
                  description: Internal investigation into supplier payments linked to Project Falcon.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Matter" }
              examples:
                created:
                  $ref: "#/components/examples/MatterNew"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /matters/{matterId}:
    parameters:
      - $ref: "#/components/parameters/MatterId"
    get:
      tags: [matters]
      operationId: getMatter
      summary: Matter details
      description: Details, custodians, sites and the state of the query used by the matter header.
      responses:
        "200":
          description: The matter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Matter" }
              examples:
                falcon:
                  $ref: "#/components/examples/MatterFalcon"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [matters]
      operationId: updateMatter
      summary: Edit matter details
      description: Changes the name, type or description. The matter number cannot change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatterUpdate" }
            examples:
              rename:
                value: { description: Internal investigation into supplier payments (Project Falcon). }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Matter" }
              examples:
                falcon:
                  $ref: "#/components/examples/MatterFalcon"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /matters/{matterId}/custodians/{userId}:
    parameters:
      - $ref: "#/components/parameters/MatterId"
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [matters]
      operationId: upsertCustodian
      summary: Add or update a custodian
      description: Adds the person as a custodian, or changes which of their sources are searched. Changing sources makes the next estimate a new query version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustodianUpsert" }
            examples:
              megan:
                value: { mailbox: true, onedrive: true, sites: ["https://contoso.sharepoint.com/sites/ProjectFalcon"] }
      responses:
        "200":
          description: The custodian as saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Custodian" }
              examples:
                megan:
                  $ref: "#/components/examples/CustodianMegan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [matters]
      operationId: removeCustodian
      summary: Remove a custodian
      description: Removes the custodian from the matter. A hold on them must be released first.
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /matters/{matterId}/custodians/{userId}/hold:
    parameters:
      - $ref: "#/components/parameters/MatterId"
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [matters]
      operationId: setCustodianHold
      summary: Place or release a hold
      description: |
        Places or releases a Purview legal hold on the custodian's sources. Purview applies holds
        in the background, so the hold shows `pending` until Purview reports it is on.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HoldUpdate" }
            examples:
              place:
                value: { on_hold: true }
      responses:
        "200":
          description: The custodian with the new hold state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Custodian" }
              examples:
                pending:
                  value:
                    user_id: 3c1a7f5e-0000-4000-8000-0000000000a1
                    display_name: Alex Wilber
                    email: alex.wilber@contoso.com
                    department: Procurement
                    initials: AW
                    mailbox: true
                    onedrive: true
                    sites: []
                    hold: { status: pending, since: null }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/PurviewFailed"

  /matters/{matterId}/sites:
    parameters:
      - $ref: "#/components/parameters/MatterId"
    post:
      tags: [matters]
      operationId: addSite
      summary: Add a site without a custodian
      description: Adds a SharePoint site that belongs to no custodian (for example a team site).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteCreate" }
            examples:
              finance:
                value: { url: "https://contoso.sharepoint.com/sites/Finance" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
              examples:
                finance:
                  value: { id: site_finance, url: "https://contoso.sharepoint.com/sites/Finance" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /matters/{matterId}/sites/{siteId}:
    parameters:
      - $ref: "#/components/parameters/MatterId"
      - name: siteId
        in: path
        required: true
        description: Site ID
        schema: { type: string }
    delete:
      tags: [matters]
      operationId: removeSite
      summary: Remove a site
      description: Removes a site without a custodian from the matter.
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /matters/{matterId}/draft:
    parameters:
      - $ref: "#/components/parameters/MatterId"
    get:
      tags: [criteria]
      operationId: getDraft
      summary: The criteria being edited
      description: The draft criteria, and whether they differ from the last estimated query version.
      responses:
        "200":
          description: The draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
              examples:
                falcon:
                  $ref: "#/components/examples/DraftFalcon"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [criteria]
      operationId: saveDraft
      summary: Save the criteria being edited
      description: |
        Saves the draft. Nothing is sent to Purview until the draft is estimated. Any criteria that
        match the schema are saved, even ones `/kql/preview` would reject (a leading wildcard, say),
        so work in progress is never lost; `POST .../estimates` refuses invalid criteria with
        `criteria_invalid`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftUpdate" }
            examples:
              falcon:
                $ref: "#/components/examples/CriteriaRequestFalcon"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
              examples:
                falcon:
                  $ref: "#/components/examples/DraftFalcon"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /kql/preview:
    post:
      tags: [criteria]
      operationId: previewKql
      summary: KQL and methodology for some criteria
      description: Criteria in; KQL, plain-English methodology and warnings out. No Purview call, so it is instant. The Scope screen calls this as the user types (debounced).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KqlPreviewRequest" }
            examples:
              falcon:
                $ref: "#/components/examples/CriteriaRequestFalcon"
      responses:
        "200":
          description: The query and its methodology
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KqlPreview" }
              examples:
                falcon:
                  $ref: "#/components/examples/KqlPreviewFalcon"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/CriteriaInvalid"

  /matters/{matterId}/estimates:
    parameters:
      - $ref: "#/components/parameters/MatterId"
    post:
      tags: [criteria]
      operationId: startEstimate
      summary: Estimate the current draft
      description: |
        Creates a new query version from the draft (if it changed) and asks Purview for counts.
        The job result is an `EstimateResult`.
      responses:
        "202":
          description: Estimate started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
              examples:
                queued:
                  value:
                    id: job_01HF3EST
                    kind: estimate
                    status: queued
                    progress: 0
                    matter_id: mat_falcon
                    created_at: "2026-11-05T10:41:12Z"
                    updated_at: "2026-11-05T10:41:12Z"
                    result: null
                    error: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/JobAlreadyRunning"
        "422":
          $ref: "#/components/responses/CriteriaInvalid"

  /matters/{matterId}/previews:
    parameters:
      - $ref: "#/components/parameters/MatterId"
    post:
      tags: [previews]
      operationId: startPreview
      summary: Start a preview
      description: |
        Estimates the latest query version and builds Purview's item report (metadata only, no
        content leaves Purview). The job result is a `Preview`.
      responses:
        "202":
          description: Preview started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
              examples:
                running:
                  value:
                    id: job_01HF3PRV
                    kind: preview
                    status: running
                    progress: 0.42
                    matter_id: mat_falcon
                    created_at: "2026-11-05T10:41:30Z"
                    updated_at: "2026-11-05T10:42:05Z"
                    result: null
                    error: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/JobAlreadyRunning"

  /matters/{matterId}/previews/latest:
    parameters:
      - $ref: "#/components/parameters/MatterId"
    get:
      tags: [previews]
      operationId: getLatestPreview
      summary: The latest preview
      description: Counts and breakdowns of the most recent preview. `stale` is true when the draft has changed since.
      responses:
        "200":
          description: The latest preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preview" }
              examples:
                falcon:
                  $ref: "#/components/examples/PreviewFalcon"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /previews/{previewId}/items:
    parameters:
      - $ref: "#/components/parameters/PreviewId"
    get:
      tags: [previews]
      operationId: listPreviewItems
      summary: Items in a preview
      description: One page of the item table, with the same filters as the breakdown bars.
      parameters:
        - name: location
          in: query
          description: Custodian name or site, as in `by_location`
          schema: { type: string }
        - name: type
          in: query
          description: Item type
          schema: { $ref: "#/components/schemas/ItemType" }
        - name: label
          in: query
          description: Label path as in `by_label`, or `No label`
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreviewItemPage" }
              examples:
                firstPage:
                  $ref: "#/components/examples/PreviewItemsFalcon"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /previews/{previewId}/items.csv:
    parameters:
      - $ref: "#/components/parameters/PreviewId"
    get:
      tags: [previews]
      operationId: downloadPreviewItemsCsv
      summary: All items as CSV
      description: The full item list (`preview.csv`), same columns as the CLI writes.
      responses:
        "200":
          description: CSV file
          headers:
            Content-Disposition:
              description: "attachment; filename=\"M-2026-0142 preview v3.csv\""
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string }
              examples:
                head:
                  value: |
                    item_id,location,item_type,subject,author,date,size,sensitivity_label,encrypted
                    dry-item-00001,alex.wilber@contoso.com,IPM.Note,RE: Falcon supplier payment schedule,alex.wilber@contoso.com,2024-03-14T10:00:00Z,49152,Confidential/Finance,false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /matters/{matterId}/term-reports:
    parameters:
      - $ref: "#/components/parameters/MatterId"
    post:
      tags: [terms]
      operationId: startTermReport
      summary: Count hits per term
      description: Counts each term within all other filters, using a separate Purview search so the main search is untouched. The job result is a `TermReport`.
      responses:
        "202":
          description: Term report started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
              examples:
                queued:
                  value:
                    id: job_01HF3TRM
                    kind: term_report
                    status: queued
                    progress: 0
                    matter_id: mat_falcon
                    created_at: "2026-11-05T10:49:00Z"
                    updated_at: "2026-11-05T10:49:00Z"
                    result: null
                    error: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/JobAlreadyRunning"
        "422":
          $ref: "#/components/responses/CriteriaInvalid"

  /matters/{matterId}/term-reports/latest:
    parameters:
      - $ref: "#/components/parameters/MatterId"
    get:
      tags: [terms]
      operationId: getLatestTermReport
      summary: The latest term report
      description: Hits per term from the most recent term report.
      responses:
        "200":
          description: The latest term report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TermReport" }
              examples:
                falcon:
                  $ref: "#/components/examples/TermReportFalcon"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /matters/{matterId}/exports/check:
    parameters:
      - $ref: "#/components/parameters/MatterId"
    post:
      tags: [exports]
      operationId: checkExport
      summary: Run the export checks
      description: |
        Runs the same checks as a real export (previewed, same sources, counts unchanged) without
        exporting. Re-checks counts with Purview, so it can take a few seconds.
      responses:
        "200":
          description: The checks. `ready` is false if any failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportCheck" }
              examples:
                ready:
                  $ref: "#/components/examples/ExportCheckReady"
                notPreviewed:
                  value:
                    ready: false
                    blocked_code: export_not_previewed
                    version: 4
                    previewed_version: 3
                    previewed_at: "2026-11-05T10:42:00Z"
                    checked_at: "2026-11-05T11:20:00Z"
                    counts: null
                    checks:
                      - { key: previewed, status: failed, message: "Query v4 hasn't been previewed. Preview it first, so the export matches what was reviewed." }
                      - { key: same_sources, status: passed, message: Same custodians and sites as the preview. }
                      - { key: counts_unchanged, status: skipped, message: Not checked because the query wasn't previewed. }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/Throttled"

  /matters/{matterId}/exports:
    parameters:
      - $ref: "#/components/parameters/MatterId"
    get:
      tags: [exports]
      operationId: listExports
      summary: Export history
      description: Every export for the matter, newest first.
      responses:
        "200":
          description: Exports
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportList" }
              examples:
                falcon:
                  $ref: "#/components/examples/ExportListFalcon"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [exports]
      operationId: startExport
      summary: Start a guarded export
      description: |
        Runs the export checks, then starts the Purview export. Refused (and nothing is sent to
        Purview) if the query wasn't previewed (`export_not_previewed`), if counts changed and
        `accept_changes` is false (`export_counts_changed`), or if `confirm_matter_number` doesn't
        match (`confirmation_mismatch`). The job result is an `Export`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportStart" }
            examples:
              falcon:
                value:
                  confirm_matter_number: M-2026-0142
                  accept_changes: false
                  options: { include_partially_indexed: true, partially_indexed_scope: responsiveLocations, format: pst, include_cloud_attachments: false, teams_transcripts: true }
      responses:
        "202":
          description: Export started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
              examples:
                queued:
                  value:
                    id: job_01HF3EXP
                    kind: export
                    status: queued
                    progress: 0
                    matter_id: mat_falcon
                    created_at: "2026-11-05T10:58:40Z"
                    updated_at: "2026-11-05T10:58:40Z"
                    result: null
                    error: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The export doesn't match the preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                notPreviewed:
                  $ref: "#/components/examples/ErrorExportNotPreviewed"
                countsChanged:
                  $ref: "#/components/examples/ErrorExportCountsChanged"
        "422":
          description: The typed matter number doesn't match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                mismatch:
                  value:
                    code: confirmation_mismatch
                    message: Type the matter number M-2026-0142 exactly to confirm the export.
                    details: { expected: M-2026-0142 }

  /exports/{exportId}:
    parameters:
      - $ref: "#/components/parameters/ExportId"
    get:
      tags: [exports]
      operationId: getExport
      summary: Export status
      description: Status of one export, including any download or review set hand-off.
      responses:
        "200":
          description: The export
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Export" }
              examples:
                ready:
                  $ref: "#/components/examples/ExportReady"
                preparing:
                  $ref: "#/components/examples/ExportPreparing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /exports/{exportId}/download:
    parameters:
      - $ref: "#/components/parameters/ExportId"
    post:
      tags: [exports]
      operationId: startExportDownload
      summary: Download the package
      description: Downloads the finished export package from Purview to SearchTrail's storage. The job result is an `Export` with `download.status` set.
      responses:
        "202":
          description: Download started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
              examples:
                queued:
                  value:
                    id: job_01HF3DL1
                    kind: download
                    status: queued
                    progress: 0
                    matter_id: mat_falcon
                    created_at: "2026-11-05T12:10:00Z"
                    updated_at: "2026-11-05T12:10:00Z"
                    result: null
                    error: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /exports/{exportId}/review-set:
    parameters:
      - $ref: "#/components/parameters/ExportId"
    post:
      tags: [exports]
      operationId: startReviewSetHandoff
      summary: Send to a Purview review set
      description: Adds the exported search's results to a Purview review set, for Relativity's Purview Sync. The job result is an `Export` with `review_set` set.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewSetRequest" }
            examples:
              relativity:
                value: { review_set_name: M-2026-0142 Relativity v3 }
      responses:
        "202":
          description: Hand-off started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
              examples:
                queued:
                  value:
                    id: job_01HF3RS1
                    kind: review_set
                    status: queued
                    progress: 0
                    matter_id: mat_falcon
                    created_at: "2026-11-05T12:12:00Z"
                    updated_at: "2026-11-05T12:12:00Z"
                    result: null
                    error: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /matters/{matterId}/versions:
    parameters:
      - $ref: "#/components/parameters/MatterId"
    get:
      tags: [log]
      operationId: listVersions
      summary: Query versions
      description: Every query version, oldest first, with its counts.
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryVersionList" }
              examples:
                falcon:
                  $ref: "#/components/examples/VersionsFalcon"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /matters/{matterId}/versions/compare:
    parameters:
      - $ref: "#/components/parameters/MatterId"
    get:
      tags: [log]
      operationId: compareVersions
      summary: Compare two query versions
      description: Plain-English differences between two versions' methodology and sources, and the change in counts.
      parameters:
        - name: from
          in: query
          required: true
          description: Earlier version number
          schema: { type: integer, minimum: 1, examples: [2] }
        - name: to
          in: query
          required: true
          description: Later version number
          schema: { type: integer, minimum: 1, examples: [3] }
      responses:
        "200":
          description: The comparison
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionComparison" }
              examples:
                v2v3:
                  $ref: "#/components/examples/CompareV2V3"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /matters/{matterId}/log:
    parameters:
      - $ref: "#/components/parameters/MatterId"
    get:
      tags: [log]
      operationId: listLogEntries
      summary: Log entries
      description: The matter's hash-chained log, newest first.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogEntryPage" }
              examples:
                falcon:
                  $ref: "#/components/examples/LogFalcon"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /matters/{matterId}/log/verify:
    parameters:
      - $ref: "#/components/parameters/MatterId"
    post:
      tags: [log]
      operationId: verifyLog
      summary: Check the hash chain
      description: Recomputes every entry's hash. Reports the first entry that was changed, removed or reordered.
      responses:
        "200":
          description: The result. `ok` is false if the chain is broken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogVerification" }
              examples:
                intact:
                  value: { ok: true, entries: 8, first_bad_seq: null, message: "8 entries verified, chain intact", verified_at: "2026-11-05T11:02:00Z" }
                broken:
                  value: { ok: false, entries: 8, first_bad_seq: 5, message: "Entry 5: contents were modified after it was written", verified_at: "2026-11-05T11:02:00Z" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /matters/{matterId}/jobs:
    parameters:
      - $ref: "#/components/parameters/MatterId"
    get:
      tags: [jobs]
      operationId: listMatterJobs
      summary: Jobs for a matter
      description: |
        The matter's jobs, newest first. Screens call this with `active=true` when they load, so a
        long action started earlier (or in another tab) is picked up and followed after a reload.
      parameters:
        - name: active
          in: query
          description: Only queued or running jobs
          schema: { type: boolean, default: false }
        - name: kind
          in: query
          description: Only jobs of this kind
          schema: { $ref: "#/components/schemas/JobKind" }
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobList" }
              examples:
                previewRunning:
                  value:
                    items:
                      - id: job_01HF3PRV
                        kind: preview
                        status: running
                        progress: 0.42
                        matter_id: mat_falcon
                        created_at: "2026-11-05T10:41:30Z"
                        updated_at: "2026-11-05T10:42:05Z"
                        result: null
                        error: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        description: Job ID
        schema: { type: string, examples: [job_01HF3PRV] }
    get:
      tags: [jobs]
      operationId: getJob
      summary: Job status
      description: Status and progress of a long action. Poll every 3 to 10 seconds until `succeeded` or `failed`.
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
              examples:
                running:
                  value:
                    id: job_01HF3PRV
                    kind: preview
                    status: running
                    progress: 0.42
                    matter_id: mat_falcon
                    created_at: "2026-11-05T10:41:30Z"
                    updated_at: "2026-11-05T10:42:05Z"
                    result: null
                    error: null
                estimateDone:
                  value:
                    id: job_01HF3EST
                    kind: estimate
                    status: succeeded
                    progress: 1
                    matter_id: mat_falcon
                    created_at: "2026-11-05T10:41:12Z"
                    updated_at: "2026-11-05T10:41:58Z"
                    result:
                      version: 3
                      estimated_at: "2026-11-05T10:41:58Z"
                      counts: { items: 630, size_bytes: 30408704, partial_items: 25, partial_size_bytes: 22754099, mailboxes: 2, sites: 4 }
                    error: null
                failed:
                  value:
                    id: job_01HF3EXP
                    kind: export
                    status: failed
                    progress: 0.1
                    matter_id: mat_falcon
                    created_at: "2026-11-05T10:58:40Z"
                    updated_at: "2026-11-05T11:03:10Z"
                    result: null
                    error: { code: purview_operation_failed, message: "Purview stopped the export: the search could not be found. Check the case in the Purview portal, then try again.", details: { purview_status: failed } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: st_session
      description: HTTP-only session cookie set by `/auth/callback`.

  parameters:
    MatterId:
      name: matterId
      in: path
      required: true
      description: Matter ID (not the matter number)
      schema: { type: string, examples: [mat_falcon] }
    UserId:
      name: userId
      in: path
      required: true
      description: Entra object ID of the person
      schema: { type: string, examples: [3c1a7f5e-0000-4000-8000-0000000000a1] }
    PreviewId:
      name: previewId
      in: path
      required: true
      description: Preview ID
      schema: { type: string, examples: [prv_falcon_v3] }
    ExportId:
      name: exportId
      in: path
      required: true
      description: Export ID
      schema: { type: string, examples: [exp_falcon_v3] }
    Page:
      name: page
      in: query
      description: Page number, from 1
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      description: Items per page
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    BadRequest:
      description: The request is malformed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            badRequest:
              value: { code: validation_failed, message: "matter_number must be letters, digits, dots, dashes or underscores.", details: { field: matter_number } }
    Unauthorized:
      description: Not signed in, or the session expired
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            expired:
              value: { code: session_expired, message: Your session has ended. Sign in again to continue., details: {} }
    Forbidden:
      description: Purview or Microsoft 365 refused for lack of a role or licence
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            role:
              value: { code: purview_permission_missing, message: "You need the eDiscovery Manager role in Purview. Ask your Purview admin to add you to the eDiscovery Manager role group.", details: { role: eDiscovery Manager } }
            licence:
              value: { code: license_missing, message: "This tenant has no eDiscovery (Premium) licence (E5 or E5 Compliance), which the Graph eDiscovery APIs need.", details: {} }
    NotFound:
      description: No such resource, or not visible to you
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            notFound:
              value: { code: not_found, message: No matter with that ID., details: {} }
    Conflict:
      description: The request conflicts with the current state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            duplicate:
              value: { code: conflict, message: A matter with number M-2026-0142 already exists., details: {} }
    JobAlreadyRunning:
      description: A job of this kind is already queued or running for this matter. Follow it instead (details.job_id).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            running:
              value: { code: conflict, message: A preview is already running for this matter., details: { job_id: job_01HF3PRV } }
    CriteriaInvalid:
      description: The criteria are invalid. Nothing was sent to Purview.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            leadingWildcard:
              value: { code: criteria_invalid, message: "Search term '*voice' starts with a wildcard, which Purview doesn't support. Use a prefix like invoic* instead.", details: { field: keywords, value: "*voice" } }
    Throttled:
      description: Microsoft Graph is throttling requests
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            throttled:
              value: { code: graph_throttled, message: Microsoft is limiting requests right now. Try again in a minute., details: { retry_after_seconds: 60 } }
    PurviewFailed:
      description: Purview reported a failure
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            failed:
              value: { code: purview_operation_failed, message: Purview could not place the hold. Check the case in the Purview portal and try again., details: { purview_status: failed } }

