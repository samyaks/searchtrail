  schemas:
    Health:
      type: object
      description: Service health
      required: [status, version, database, dry_run]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        database: { type: string, enum: [ok, unreachable] }
        dry_run: { type: boolean, description: True when SEARCHTRAIL_DRY_RUN=1 (no tenant is contacted) }

    ErrorCode:
      type: string
      description: |
        Machine-readable error code. The UI must handle each of: `criteria_invalid`,
        `export_not_previewed`, `export_counts_changed`, `confirmation_mismatch`,
        `purview_permission_missing`, `license_missing`, `graph_throttled`,
        `purview_operation_failed`, `session_expired`. The generic codes `validation_failed`,
        `not_found`, `conflict` and `internal_error` can appear anywhere.
      enum:
        - criteria_invalid
        - export_not_previewed
        - export_counts_changed
        - confirmation_mismatch
        - purview_permission_missing
        - license_missing
        - graph_throttled
        - purview_operation_failed
        - session_expired
        - validation_failed
        - not_found
        - conflict
        - internal_error

    Error:
      type: object
      description: Every error response has this shape.
      required: [code, message, details]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string, description: "A plain-English explanation and how to fix it, safe to show to the user" }
        details:
