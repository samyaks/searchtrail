        matter_number: { type: string }
        name: { type: string }
        type: { $ref: "#/components/schemas/MatterType" }
        description: { type: string }
        stage: { $ref: "#/components/schemas/MatterStage" }
        purview_case_id: { type: [string, "null"], description: Set once the Purview case exists }
        created_at: { type: string, format: date-time }
        created_by: { $ref: "#/components/schemas/UserRef" }
        custodians:
          type: array
          items: { $ref: "#/components/schemas/Custodian" }
        sites:
          type: array
          description: Sites without a custodian
          items: { $ref: "#/components/schemas/Site" }
        current_version: { type: [integer, "null"] }
        previewed_version: { type: [integer, "null"] }
        last_previewed_at: { type: [string, "null"], format: date-time }
        draft_changed: { type: boolean, description: True when the draft criteria or sources differ from the current version }

    HoldStatus:
      type: string
      description: "`pending`: requested, Purview is applying it. `releasing`: release requested."
      enum: ["off", pending, "on", releasing, failed]

    Hold:
      type: object
      description: Legal hold state for a custodian
      required: [status, since]
      properties:
        status: { $ref: "#/components/schemas/HoldStatus" }
        since: { type: [string, "null"], format: date-time, description: When the hold took effect }

    HoldUpdate:
      type: object
      description: "Place (`on_hold`: true) or release (`on_hold`: false) a hold"
      required: [on_hold]
      additionalProperties: false
      properties:
        on_hold: { type: boolean }

    Custodian:
      type: object
      description: A person whose data is searched
      required: [user_id, display_name, email, department, initials, mailbox, onedrive, sites, hold]
      properties:
        user_id: { type: string }
        display_name: { type: string }
        email: { type: string, format: email }
        department: { type: [string, "null"] }
        initials: { type: string }
        mailbox: { type: boolean, description: Search the mailbox and Teams chats }
        onedrive: { type: boolean, description: Search OneDrive }
        sites:
          type: array
          description: SharePoint sites linked to this custodian
          items: { type: string, format: uri }
        hold: { $ref: "#/components/schemas/Hold" }

    CustodianUpsert:
      type: object
      description: Which of the custodian's sources to search. At least one of mailbox, onedrive or a site.
      required: [mailbox, onedrive]
      additionalProperties: false
      properties:
        mailbox: { type: boolean }
        onedrive: { type: boolean }
        sites:
          type: array
          items: { type: string, format: uri }
          default: []

    Site:
      type: object
      description: A SharePoint site without a custodian
      required: [id, url]
      properties:
        id: { type: string }
        url: { type: string, format: uri }

    SiteCreate:
      type: object
      description: A SharePoint site URL (https)
      required: [url]
      additionalProperties: false
      properties:
        url: { type: string, format: uri, pattern: "^https://" }

    ItemKind:
      type: string
      description: "Item types a search can include: emails, Teams chats, documents"
      enum: [email, chats, docs]

    Criteria:
      type: object
      description: |
        Search criteria. Same fields as `CullCriteria` in `backend/searchtrail/query.py`.
        Each filter applies only to the item types it makes sense for (domains to emails and
        chats, file types to documents).
      additionalProperties: false
      required: [keywords, keyword_mode, exclude_keywords, date_from, date_to, kinds, file_extensions, participant_domains, exclude_participant_domains, label_ids, exclude_label_ids, doc_date_property, raw_kql]
      properties:
        keywords:
          type: array
          description: Terms and phrases. `word*` is a prefix match; leading wildcards are rejected.
          items: { type: string, minLength: 1 }
        keyword_mode: { type: string, enum: [any, all] }
        exclude_keywords:
          type: array
          items: { type: string, minLength: 1 }
        date_from: { type: [string, "null"], format: date, description: Inclusive }
        date_to: { type: [string, "null"], format: date, description: Inclusive }
        kinds:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ItemKind" }
        file_extensions:
          type: array
          description: Documents only
          items: { type: string, pattern: "^[a-z0-9]{1,10}$" }
        participant_domains:
          type: array
          description: Emails and chats only
          items: { type: string }
        exclude_participant_domains:
          type: array
          description: Emails and chats only
          items: { type: string }
        label_ids:
          type: array
          description: Only items with these labels (a parent includes its sublabels). Excludes unlabelled items.
          items: { type: string, format: uuid }
        exclude_label_ids:
          type: array
          items: { type: string, format: uuid }
        doc_date_property: { type: string, enum: [lastmodifiedtime, created] }
        raw_kql: { type: [string, "null"], description: "Expert escape hatch, ANDed onto the query" }

    Draft:
      type: object
      description: The criteria being edited on the Scope screen
      required: [criteria, updated_at, based_on_version, changed_since_version]
      properties:
        criteria: { $ref: "#/components/schemas/Criteria" }
        updated_at: { type: string, format: date-time }
        based_on_version: { type: [integer, "null"] }
        changed_since_version: { type: boolean, description: "True when the draft would produce a different query or sources than `based_on_version`" }

    DraftUpdate:
      type: object
      description: New draft criteria
      required: [criteria]
      additionalProperties: false
      properties:
        criteria: { $ref: "#/components/schemas/Criteria" }

    KqlPreviewRequest:
      type: object
      description: Criteria to turn into KQL
      required: [criteria]
      additionalProperties: false
      properties:
        criteria: { $ref: "#/components/schemas/Criteria" }

    KqlPreview:
      type: object
      description: The KQL, its plain-English methodology and any warnings
      required: [kql, length, methodology, warnings]
      properties:
        kql: { type: string }
        length: { type: integer, description: "Characters in the KQL. Purview has length limits; a warning appears past 4,000." }
        methodology:
          type: array
          description: One sentence per line, ready for a methodology memo
          items: { type: string }
        warnings:
          type: array
          items: { type: string }

    Counts:
      type: object
      description: Counts from a Purview estimate
      required: [items, size_bytes, partial_items, partial_size_bytes, mailboxes, sites]
      properties:
        items: { type: integer, minimum: 0, description: Indexed items matching }
        size_bytes: { type: integer, minimum: 0 }
        partial_items: { type: integer, minimum: 0, description: Partially indexed items (could not be keyword-searched) }
        partial_size_bytes: { type: integer, minimum: 0 }
        mailboxes: { type: integer, minimum: 0 }
        sites: { type: integer, minimum: 0 }

    EstimateResult:
      type: object
      description: Result of an `estimate` job
      required: [version, estimated_at, counts]
      properties:
        version: { type: integer }
        estimated_at: { type: string, format: date-time }
        counts: { $ref: "#/components/schemas/Counts" }

    NamedCount:
      type: object
      description: One bar in a breakdown
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer, minimum: 0 }

    MonthCount:
      type: object
      description: One month in the month chart
      required: [month, count]
      properties:
        month: { type: string, pattern: "^\\d{4}-\\d{2}$" }
        count: { type: integer, minimum: 0 }

    Preview:
      type: object
      description: A preview's counts and breakdowns
      required: [id, matter_id, version, created_at, created_by, stale, counts, report_items, encrypted_items, breakdowns, unmapped_columns]
      properties:
        id: { type: string }
        matter_id: { type: string }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        created_by: { $ref: "#/components/schemas/UserRef" }
        stale: { type: boolean, description: True when the draft changed after this preview }
        counts: { $ref: "#/components/schemas/Counts" }
        report_items: { type: integer, description: "Rows in Purview's item report (matching plus partially indexed, if included)" }
        encrypted_items: { type: integer }
        breakdowns:
          type: object
          required: [by_location, by_type, by_label, by_month]
          properties:
            by_location: { type: array, items: { $ref: "#/components/schemas/NamedCount" } }
            by_type: { type: array, items: { $ref: "#/components/schemas/NamedCount" } }
            by_label: { type: array, items: { $ref: "#/components/schemas/NamedCount" } }
            by_month: { type: array, items: { $ref: "#/components/schemas/MonthCount" } }
        unmapped_columns:
          type: array
          description: Report columns the parser didn't recognise (see report.COLUMN_CANDIDATES)
          items: { type: string }

    ItemType:
      type: string
      description: Item type in the preview table
      enum: [email, teams_chat, document, other]

    PreviewItem:
      type: object
      description: One row of the item table (metadata only)
      required: [id, title, location, type, date, label, size_bytes, encrypted]
      properties:
        id: { type: string }
        title: { type: string }
        location: { type: string, description: Custodian name or site }
        type: { $ref: "#/components/schemas/ItemType" }
        date: { type: [string, "null"], format: date-time }
        label: { type: [string, "null"], description: Label path; null when unlabelled }
        size_bytes: { type: [integer, "null"] }
        encrypted: { type: boolean }

    PreviewItemPage:
      type: object
      description: A page of preview items
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PreviewItem" }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }

    TermRow:
      type: object
      description: Hits for one term within all other filters
      required: [term, items, size_bytes, previous_items, previous_version]
      properties:
        term: { type: string, description: The term as it appears in the KQL }
        items: { type: integer }
        size_bytes: { type: integer }
        previous_items: { type: [integer, "null"], description: Hits in the previous version's term report; null if the term is new }
        previous_version: { type: [integer, "null"] }

    TermReport:
      type: object
      description: Hits per term
      required: [id, matter_id, version, created_at, created_by, stale, combined, rows]
      properties:
        id: { type: string }
        matter_id: { type: string }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        created_by: { $ref: "#/components/schemas/UserRef" }
        stale: { type: boolean }
        combined:
          type: object
          description: All terms together (the full query)
          required: [items, size_bytes]
          properties:
            items: { type: integer }
            size_bytes: { type: integer }
        rows:
          type: array
          items: { $ref: "#/components/schemas/TermRow" }

    ExportOptions:
      type: object
      description: Purview export settings
      required: [include_partially_indexed, format]
      additionalProperties: false
      properties:
        include_partially_indexed: { type: boolean, description: "Decide this deliberately, with counsel. The choice is logged." }
        partially_indexed_scope:
          type: string
          enum: [responsiveLocations, "responsiveLocations, nonresponsiveLocations"]
          default: responsiveLocations
        format: { type: string, enum: [pst, msg] }
        include_cloud_attachments: { type: boolean, default: false, description: Files linked in emails (current version) }
        teams_transcripts: { type: boolean, default: true, description: HTML transcript per Teams conversation }

    ExportCheckItem:
      type: object
      description: One export check
      required: [key, status, message]
      properties:
        key: { type: string, enum: [previewed, same_sources, counts_unchanged] }
        status: { type: string, enum: [passed, failed, skipped] }
        message: { type: string }

    ExportCheck:
      type: object
      description: Result of the export checks
      required: [ready, blocked_code, version, previewed_version, previewed_at, checked_at, counts, checks]
      properties:
        ready: { type: boolean }
        blocked_code:
          description: The error a real export would return now, if any
          oneOf:
            - type: string
              enum: [export_not_previewed, export_counts_changed]
            - type: "null"
        version: { type: [integer, "null"] }
        previewed_version: { type: [integer, "null"] }
        previewed_at: { type: [string, "null"], format: date-time }
        checked_at: { type: string, format: date-time }
        counts:
          description: Counts now (null if not re-checked)
          oneOf:
            - $ref: "#/components/schemas/Counts"
            - type: "null"
        checks:
          type: array
          items: { $ref: "#/components/schemas/ExportCheckItem" }

    ExportStart:
      type: object
      description: Start an export. The user types the matter number to confirm.
      required: [options, confirm_matter_number]
      additionalProperties: false
      properties:
        options: { $ref: "#/components/schemas/ExportOptions" }
        confirm_matter_number: { type: string }
        accept_changes: { type: boolean, default: false, description: Export even if counts changed since the preview (logged) }

    ExportStatus:
      type: string
      description: Purview export state
      enum: [preparing, ready, failed, expired]

    HandoffStatus:
      type: string
      description: State of a download or review set hand-off
      enum: [none, running, done, failed]

    Export:
      type: object
      description: An export and its hand-offs
      required: [id, matter_id, name, version, status, progress, counts, options, changes_accepted, started_at, started_by, finished_at, expires_at, files, download, review_set]
      properties:
        id: { type: string }
        matter_id: { type: string }
        name: { type: string, description: The export's name in Purview }
        version: { type: integer }
        status: { $ref: "#/components/schemas/ExportStatus" }
        progress: { type: number, minimum: 0, maximum: 1 }
        counts: { $ref: "#/components/schemas/Counts" }
        options: { $ref: "#/components/schemas/ExportOptions" }
        changes_accepted: { type: boolean }
        started_at: { type: string, format: date-time }
        started_by: { $ref: "#/components/schemas/UserRef" }
        finished_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time, description: When Purview deletes the download (about 30 days) }
        files:
          type: array
          items:
            type: object
            required: [name, size_bytes]
            properties:
              name: { type: string }
              size_bytes: { type: [integer, "null"] }
        download:
          type: object
          required: [status, progress, stored_path, finished_at]
          properties:
            status: { $ref: "#/components/schemas/HandoffStatus" }
            progress: { type: [number, "null"], minimum: 0, maximum: 1 }
            stored_path: { type: [string, "null"], description: Where the package was stored (in SearchTrail's storage) }
            finished_at: { type: [string, "null"], format: date-time }
        review_set:
          type: object
          required: [status, name, finished_at]
          properties:
            status: { $ref: "#/components/schemas/HandoffStatus" }
            name: { type: [string, "null"] }
            finished_at: { type: [string, "null"], format: date-time }

    ExportList:
      type: object
      description: Exports, newest first
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Export" }

    ReviewSetRequest:
      type: object
      description: The review set to add to (created if missing)
      required: [review_set_name]
      additionalProperties: false
      properties:
        review_set_name: { type: string, minLength: 1, maxLength: 200 }

    QueryVersion:
      type: object
      description: A frozen query version, created when a changed draft is estimated
      required: [version, created_at, created_by, summary, criteria, kql, methodology, sources_fingerprint, purview_search_id, counts, exported]
      properties:
        version: { type: integer }
        created_at: { type: string, format: date-time }
        created_by: { $ref: "#/components/schemas/UserRef" }
        summary: { type: string, description: Short description of what changed from the previous version }
        criteria: { $ref: "#/components/schemas/Criteria" }
        kql: { type: string }
        methodology: { type: array, items: { type: string } }
        sources_fingerprint: { type: string, description: SHA-256 of the custodians and sites searched }
        purview_search_id: { type: [string, "null"] }
        counts:
          oneOf:
            - $ref: "#/components/schemas/Counts"
            - type: "null"
        exported: { type: boolean }

    QueryVersionList:
      type: object
      description: Query versions, oldest first
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/QueryVersion" }

    VersionComparison:
      type: object
      description: Differences between two versions
      required: [from, to, changes, unchanged, sources_changed, counts]
      properties:
        from: { type: integer }
        to: { type: integer }
        changes:
          type: array
          items:
            type: object
            required: [change, text]
            properties:
              change: { type: string, enum: [added, removed] }
              text: { type: string }
        unchanged: { type: string, description: Plain-English list of what stayed the same }
        sources_changed: { type: boolean }
        counts:
          type: object
          required: [from_items, to_items, delta]
          properties:
            from_items: { type: [integer, "null"] }
            to_items: { type: [integer, "null"] }
            delta: { type: [integer, "null"] }

    LogAction:
      type: string
      description: What was done
      enum: [matter_created, matter_updated, custodian_added, custodian_updated, custodian_removed, site_added, site_removed, hold_placed, hold_released, estimate, preview, term_report, export_started, export_finished, export_downloaded, review_set_added]

    LogEntry:
      type: object
      description: One hash-chained log entry (same chain format as `backend/searchtrail/audit.py`)
      required: [seq, ts, action, actor, actor_email, summary, version, prev_hash, hash, details]
      properties:
        seq: { type: integer, minimum: 1 }
        ts: { type: string, format: date-time }
        action: { $ref: "#/components/schemas/LogAction" }
        actor: { type: string, description: "Display name of the person, or SearchTrail for automatic steps" }
        actor_email: { type: [string, "null"], description: "The person's sign-in name (UPN), which identifies them unambiguously; null for automatic steps" }
        summary: { type: string }
        version: { type: [integer, "null"] }
        prev_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        details:
          type: object
          description: The full logged record (KQL, criteria, counts, settings)
          additionalProperties: true

    LogEntryPage:
      type: object
      description: A page of log entries
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LogEntry" }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }

    LogVerification:
      type: object
      description: Result of checking the hash chain
      required: [ok, entries, first_bad_seq, message, verified_at]
      properties:
        ok: { type: boolean }
        entries: { type: integer }
        first_bad_seq: { type: [integer, "null"] }
        message: { type: string }
        verified_at: { type: string, format: date-time }

    JobKind:
      type: string
      description: The long action a job runs
      enum: [estimate, preview, term_report, export, download, review_set]

    JobStatus:
      type: string
      description: Job state
      enum: [queued, running, succeeded, failed]

    JobList:
      type: object
      description: Jobs, newest first
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Job" }

    Job:
      type: object
      description: |
        A long action. `result` is set when `status` is `succeeded`: an `EstimateResult`
        (estimate), `Preview` (preview), `TermReport` (term_report) or `Export` (export, download,
        review_set). `error` is set when `status` is `failed`.
      required: [id, kind, status, progress, matter_id, created_at, updated_at, result, error]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/JobKind" }
        status: { $ref: "#/components/schemas/JobStatus" }
        progress: { type: number, minimum: 0, maximum: 1 }
        matter_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        result:
          oneOf:
            - $ref: "#/components/schemas/EstimateResult"
            - $ref: "#/components/schemas/Preview"
            - $ref: "#/components/schemas/TermReport"
            - $ref: "#/components/schemas/Export"
            - type: "null"
        error:
          oneOf:
            - $ref: "#/components/schemas/Error"
            - type: "null"
