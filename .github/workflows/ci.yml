# CI for every PR and for main. All jobs must pass before merging (turn this on in branch protection).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: searchtrail
          POSTGRES_PASSWORD: searchtrail
          POSTGRES_DB: searchtrail
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U searchtrail" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SEARCHTRAIL_DATABASE_URL: postgresql+psycopg://searchtrail:searchtrail@localhost:5432/searchtrail
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt
      - run: pip install -c constraints.txt -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Migrations apply, roll back, and match the models
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: Tests (including Postgres-only tests)
        env:
          SEARCHTRAIL_TEST_DATABASE_URL: postgresql+psycopg://searchtrail:searchtrail@localhost:5432/searchtrail_test
        run: |
          PGPASSWORD=searchtrail psql -h localhost -U searchtrail -d searchtrail -c "CREATE DATABASE searchtrail_test"
          pytest -q
      - name: CLI dry run end to end
        working-directory: .
        run: |
          searchtrail --dry-run --quiet preview examples/matter.json
          searchtrail --dry-run --quiet export examples/matter.json --confirm --wait
          searchtrail --dry-run verify-log examples/matter.json

  frontend:
    name: Frontend lint, type check and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  contract:
    name: Contract lint and drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install linters and code generators (versions locked)
        run: |
          pip install -c backend/constraints.txt -e "backend[dev]"
          npm ci --prefix frontend
      - name: Lint contracts/openapi.yaml (Spectral, from the frontend lockfile)
        run: npm run --prefix frontend lint:contract
      - name: Regenerate code from the contract
        run: scripts/codegen.sh
      - name: Fail if generated code is out of date
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::Generated code doesn't match contracts/openapi.yaml. Run scripts/codegen.sh and commit the result."
            exit 1
          fi
      # Routes vs contract and examples vs the generated Pydantic models run in the backend
      # tests (backend/tests/test_contract.py); the frontend type check covers the TS side.

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack (dry run)
        run: docker compose -f deploy/docker-compose.yml up --build -d --wait --wait-timeout 300
      - name: API is healthy
        run: |
          curl -fsS http://localhost:8000/api/v1/health | tee health.json
          grep -q '"dry_run":true' health.json
      # The browser-level checks of the web service are in the e2e job (frontend/tests/e2e/). This one
      # needs the stack to break, so it stays here: with the API down, Caddy answers /api itself.
      - name: With the API stopped, /api gives the app's Error body (502)
        run: |
          docker compose -f deploy/docker-compose.yml stop api
          status=$(curl -s -o body.json -w '%{http_code}' http://localhost:8080/api/v1/health)
          cat body.json; echo
          test "$status" = 502 || { echo "::error::Expected 502 from /api with the API stopped, got $status"; exit 1; }
          grep -q '"code":"internal_error"' body.json
          docker compose -f deploy/docker-compose.yml start api
          curl -fsS --retry 20 --retry-delay 2 --retry-all-errors http://localhost:8080/api/v1/health | grep -q '"dry_run":true'
      - name: Show logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs
      - name: Stop
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  e2e:
    name: End-to-end tests (dry-run stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Install Playwright's Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start the stack (dry run)
        run: docker compose -f deploy/docker-compose.yml up --build -d --wait --wait-timeout 300
      - name: Playwright through the web service (frontend/tests/e2e/)
        working-directory: frontend
        run: npm run test:e2e
      # A failed test leaves a screenshot there. The folder starts with a dot, so hidden files must be on.
      - name: Upload the failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: frontend/tests/e2e/.results
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
      - name: Show logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs
      - name: Stop
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
