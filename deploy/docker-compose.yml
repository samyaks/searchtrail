# SearchTrail: Postgres, migrations, API, worker, and the web app on http://localhost:8080.
#   docker compose -f deploy/docker-compose.yml up --build
# Dry-run is on by default (SEARCHTRAIL_DRY_RUN=1): no Microsoft tenant is needed. The database
# remembers which mode it was set up in, and the API and worker refuse it in the other mode, so a
# live database left without its .env is refused (API unhealthy, worker exits), not served unsigned-in.
# Settings: copy deploy/.env.example to deploy/.env.
# The web service (Caddy) is the way in: it serves the app and passes /api to the API, so the browser sees
# one origin. The API port is published on this machine only (127.0.0.1), for development and checks:
# the API trusts the forwarding headers (the client address and http or https) from whoever can reach it,
# which is safe only while that is just Caddy and this machine. Don't publish it more widely.
# Behind a TLS-inspecting proxy, build the two images first with its CA bundle (the extra_ca secret in
# deploy/Dockerfile.backend and deploy/Dockerfile.web), then run `up` without --build.
name: searchtrail

x-backend-env: &backend-env
  SEARCHTRAIL_DRY_RUN: ${SEARCHTRAIL_DRY_RUN:-1}
  SEARCHTRAIL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-searchtrail}:${POSTGRES_PASSWORD:-searchtrail}@db:5432/${POSTGRES_DB:-searchtrail}
  SEARCHTRAIL_STORAGE_DIR: /data/storage

x-backend: &backend
  build:
    context: ../backend
    dockerfile: ../deploy/Dockerfile.backend
  image: searchtrail-backend:dev
  environment: *backend-env
  volumes:
    - storage:/data/storage

services:
  db:
    # Pinned by digest (the multi-arch index). To update: docker buildx imagetools inspect postgres:16-alpine
    image: postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-searchtrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-searchtrail}
      POSTGRES_DB: ${POSTGRES_DB:-searchtrail}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    <<: *backend
    environment:
      <<: *backend-env
      # Take the client address and scheme from the X-Forwarded-* headers Caddy sets (uvicorn trusts only
      # 127.0.0.1 by default). See the note at the top about who can reach the API.
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3).status != 200)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["searchtrail-worker"]
    environment:
      <<: *backend-env
      SEARCHTRAIL_WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      # Healthy while the loop has written its heartbeat in the last 30 seconds.
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/worker-heartbeat') > 30)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # The built frontend behind Caddy, which passes /api to the api service: the browser sees one origin.
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: searchtrail-web:dev
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  pgdata:
  storage:
