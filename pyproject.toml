[project]
name = "culltool"
version = "0.1.0"
description = "Cull Microsoft 365 data with Purview eDiscovery, then hand the set to Everlaw"
requires-python = ">=3.10"
dependencies = ["msal>=1.28", "requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
culltool = "culltool.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
